worker_processes 1;

events {
  worker_connections 512;
}

http {
  include /etc/nginx/mime.types;
  sendfile on;
  server_tokens off;
  # fotos dos produtos chegam até 15 MB (a API comprime)
  client_max_body_size 20m;

  # Resolve o container a cada requisição: recriar a API não exige reiniciar o nginx.
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_x_forwarded_proto $proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
  }

  server {
    listen 80;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # o IP real vem do Cloudflare/nginx (a API usa CF-Connecting-IP ou o primeiro X-Forwarded-For)
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $proto;

    location /api/ {
      set $api http://api:8080;
      proxy_pass $api;
      proxy_read_timeout 120s;
    }

    location = /actuator/health {
      set $api http://api:8080;
      proxy_pass $api;
    }

    # link de produto compartilhado: /l/<loja>/p/<id> abre o app (página l.html)
    location /l/ {
      root /usr/share/nginx/html;
      try_files /l.html =404;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'unsafe-inline'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;
    }

    # loja web do cliente: /loja/<loja>, /loja/<loja>/p/<id>, /loja/<loja>/pedido/<id> (página loja.html + loja.js)
    location /loja/ {
      root /usr/share/nginx/html;
      try_files /loja.html =404;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'" always;
    }

    # páginas públicas (/privacidade, /termos, /excluir-conta)
    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri.html $uri/ =404;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
    }
  }
}
