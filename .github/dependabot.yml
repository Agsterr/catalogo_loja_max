# Atualizações de segurança e de versão das dependências (abre PRs semanais, agrupadas).
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      spring:
        patterns: ["*"]
  - package-ecosystem: pub
    directories: ["/mobile/core", "/mobile/cliente", "/mobile/lojista"]
    schedule:
      interval: weekly
    groups:
      flutter:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
