name: Deploy (servidor)

# Igual ao Gerenciamento Max: push na main → testa → builda a imagem da API no GitHub (GHCR) → o servidor
# faz pull e reinicia (com as páginas públicas). Sem os secrets do servidor, publica só a imagem e avisa.
on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-loja-max-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://lojamax.focodev.com.br' }}
  API_IMAGE: ghcr.io/agsterr/loja-max-api

jobs:
  test:
    name: Testes da API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: loja_test
          POSTGRES_USER: loja
          POSTGRES_PASSWORD: loja
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loja"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - working-directory: backend
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/loja_test
          DB_USER: loja
          DB_PASSWORD: loja
        run: mvn -B -q verify

  build:
    name: Imagem da API
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  deploy:
    name: Deploy no servidor
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL || 'https://lojamax.focodev.com.br' }}
    steps:
      - uses: actions/checkout@v4

      - name: Servidor configurado?
        id: check
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          if [ -z "$HETZNER_SSH_KEY" ] || [ -z "$HETZNER_HOST" ]; then
            echo "::warning::Imagem publicada, mas o servidor não foi atualizado: defina HETZNER_SSH_KEY e HETZNER_HOST nos secrets (docs/DEPLOY.md)."
            echo "ready=" >> "$GITHUB_OUTPUT"
          else
            echo "ready=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurar SSH
        if: steps.check.outputs.ready
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HETZNER_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Enviar compose, nginx, script e páginas
        if: steps.check.outputs.ready
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER || 'root' }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "${USER}@${HOST}" 'mkdir -p /opt/loja-max/site'
          scp -i ~/.ssh/id_deploy -o BatchMode=yes \
            deploy/docker-compose.prod.yml deploy/nginx.conf deploy/deploy.sh "${USER}@${HOST}:/opt/loja-max/"
          scp -i ~/.ssh/id_deploy -o BatchMode=yes deploy/site/* "${USER}@${HOST}:/opt/loja-max/site/"

      - name: Pull e restart
        if: steps.check.outputs.ready
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER || 'root' }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/id_deploy -o BatchMode=yes \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=40 "${USER}@${HOST}" \
            "set -euo pipefail
             docker login ghcr.io -u ${{ github.actor }} --password-stdin >/dev/null
             trap 'docker logout ghcr.io >/dev/null' EXIT
             API_IMAGE=${API_IMAGE}:${{ github.sha }} bash /opt/loja-max/deploy.sh"

      - name: Verificar URL pública
        if: steps.check.outputs.ready
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "${PUBLIC_URL}/actuator/health" | grep -q UP; then
              echo "No ar: ${PUBLIC_URL}"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::${PUBLIC_URL} não respondeu (confira o túnel Cloudflare/DNS)."
