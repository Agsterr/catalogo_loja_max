name: CI

on:
  push:
    branches: [main, "ccr-*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (testes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: loja_test
          POSTGRES_USER: loja
          POSTGRES_PASSWORD: loja
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loja"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Testes
        working-directory: backend
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/loja_test
          DB_USER: loja
          DB_PASSWORD: loja
        run: mvn -B -q verify

  mobile:
    name: Apps Flutter (analyze, testes, APKs)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Analyze e testes (pacote comum, apps do cliente, lojista e entregador, gerador de telas)
        working-directory: mobile
        run: |
          set -euo pipefail
          for d in core cliente lojista entregador telas; do
            echo "::group::$d"
            (cd "$d" && flutter pub get && flutter analyze && if [ -d test ]; then flutter test; fi)
            echo "::endgroup::"
          done
      # APKs de release (R8) para pegar erro de Gradle/Manifest/plugin nativo. Com os secrets do Firebase e a
      # variável API_URL eles já saem com push; sem key.properties são assinados com a chave de debug.
      - name: Build dos APKs
        working-directory: mobile
        env:
          API_URL: ${{ vars.API_URL }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID_CLIENTE: ${{ secrets.FIREBASE_APP_ID_CLIENTE }}
          FIREBASE_APP_ID_LOJISTA: ${{ secrets.FIREBASE_APP_ID_LOJISTA }}
          FIREBASE_APP_ID_ENTREGADOR: ${{ secrets.FIREBASE_APP_ID_ENTREGADOR }}
        run: |
          set -euo pipefail
          build() {
            (cd "$1" && flutter build apk --release \
              --dart-define=API_URL="${API_URL:-https://lojamax.focodev.com.br}" \
              --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
              --dart-define=FIREBASE_APP_ID="$2" \
              --dart-define=FIREBASE_SENDER_ID="$FIREBASE_SENDER_ID" \
              --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID")
          }
          build cliente "$FIREBASE_APP_ID_CLIENTE"
          build lojista "$FIREBASE_APP_ID_LOJISTA"
          build entregador "$FIREBASE_APP_ID_ENTREGADOR"
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            mobile/cliente/build/app/outputs/flutter-apk/app-release.apk
            mobile/lojista/build/app/outputs/flutter-apk/app-release.apk
            mobile/entregador/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
