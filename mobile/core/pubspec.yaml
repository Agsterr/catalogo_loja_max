name: loja_core
description: Código compartilhado entre os apps Loja Max (cliente) e Loja Max Lojista.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  intl: ^0.20.2
  url_launcher: ^6.3.3
  # Imagens guardadas em disco (vitrine abre mais rápido e gasta menos internet)
  cached_network_image: ^3.4.1
  # Compartilhar produto/pedido e salvar planilhas
  share_plus: ^13.3.1
  path_provider: ^2.1.5
  flutter_secure_storage: ^11.2.0
  # Avisos: push do Firebase, notificações locais e verificação em segundo plano (igual ao Gerenciamento Max)
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  flutter_local_notifications: ^21.0.0
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
