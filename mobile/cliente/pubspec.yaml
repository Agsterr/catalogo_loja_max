name: loja_cliente
description: "Loja Max — vitrine, carrinho e pedidos nas lojas de roupas, calçados e bijuterias."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  loja_core:
    path: ../core
  http: ^1.6.0
  intl: ^0.20.2
  url_launcher: ^6.3.3
  # Carrinho e loja aberta guardados no aparelho
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
