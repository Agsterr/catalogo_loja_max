name: loja_entregador
description: "Loja Max Entregador — corridas de entrega das lojas da sua região."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  loja_core:
    path: ../core
  http: ^1.6.0
  intl: ^0.20.2
  url_launcher: ^6.3.3
  # ID do aparelho (X-Device-Id): 5 entregas grátis por aparelho e CPF
  android_id: ^0.5.0
  device_info_plus: ^13.3.0
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  shared_preferences: ^2.5.3

flutter:
  uses-material-design: true

# Ícones: por enquanto os mesmos do lojista (falta um próprio em mobile/brand/render_icons.py).
# dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: assets/icon_background.png
  adaptive_icon_foreground: assets/icon_foreground.png
  adaptive_icon_monochrome: assets/icon_monochrome.png

# Tela de abertura: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#3A0E26"
  image: assets/splash_logo.png
  android_12:
    color: "#3A0E26"
    image: assets/splash_android12.png
  fullscreen: false
  web: false
