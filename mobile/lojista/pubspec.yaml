name: loja_lojista
description: "Loja Max Lojista — pedidos, produtos, fotos, estoque e promoções da loja."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  loja_core:
    path: ../core
  share_plus: ^13.3.1
  path_provider: ^2.1.5
  http: ^1.6.0
  intl: ^0.20.2
  url_launcher: ^6.3.3
  # Fotos dos produtos (câmera/galeria), comprimidas e enviadas para o R2 pela API
  image_picker: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  shared_preferences: ^2.5.3

flutter:
  uses-material-design: true

# Ícones (gerados por mobile/brand/render_icons.py): dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: assets/icon_background.png
  adaptive_icon_foreground: assets/icon_foreground.png
  adaptive_icon_monochrome: assets/icon_monochrome.png

# Tela de abertura: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#3A0E26"
  image: assets/splash_logo.png
  android_12:
    color: "#3A0E26"
    image: assets/splash_android12.png
  fullscreen: false
  web: false
