name: loja_max
description: "Loja Max — roupas, calçados e bijuterias: vitrine, carrinho, pedidos e gestão da loja."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  intl: ^0.20.2
  url_launcher: ^6.3.3
  # Token no Keystore (Android) / Keychain (iOS)
  flutter_secure_storage: ^11.2.0
  # Carrinho guardado no aparelho
  shared_preferences: ^2.5.3
  # Fotos dos produtos (galeria/câmera) — gestão
  image_picker: ^1.2.0
  # Avisos: push do Firebase, notificações locais e verificação em segundo plano (igual ao Gerenciamento Max)
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  flutter_local_notifications: ^21.0.0
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
